general {
    # Single-instance guard. Never kills an existing hyprlock: a SIGTERM'd
    # lock client leaves Hyprland in its crashed-lock fallback, which is worse
    # than a missed lock. hyprlock refuses to start a second instance on its
    # own, so this only avoids the redundant spawn.
    # NOTE: hyprlock does not set logind's LockedHint, so LockedHint is not a
    # usable signal for whether a lock is actually held. Do not gate on it.
    lock_cmd = pidof hyprlock || hyprlock
    # lock BEFORE sleep; hypridle holds a logind inhibitor so suspend
    # waits until hyprlock has actually taken the session lock
    before_sleep_cmd = loginctl lock-session
    # kick displays back on after resume so frame callbacks restart
    # (fixes frozen terminals that only unfreeze when a new window appears)
    after_sleep_cmd = hyprctl dispatch dpms on
}
