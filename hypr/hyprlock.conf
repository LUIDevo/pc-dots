source = $HOME/.cache/wal/colors-hyprland.conf

# ANIMATIONS
# Disabled: the animation manager ticks a redraw every frame. On DP-1
# (2560x1440@165Hz) that idles at ~65% of a core. This is the key that
# actually turns fades off in v0.9.6 -- the old general:no_fade_in /
# no_fade_out / disable_loading_bar keys were removed and are silent no-ops.
animations {
    enabled = false
}

# BACKGROUND
background {
    monitor =
    #path = screenshot
    # path = $HOME/walls/a_group_of_people_walking_in_a_field_with_a_round_object_in_the_foreground.jpg
    path = $HOME/walls/wallhaven-ogy9ep.jpg
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
# v0.9.6 general: accepts only fail_timeout, fractional_scaling, hide_cursor,
# ignore_empty_input, immediate_render, screencopy_mode, text_trim.
# no_fade_in / no_fade_out / disable_loading_bar were removed -- see the
# animations block above. grace moved to the CLI (--grace 0), and 0 is the
# default, so nothing is lost by dropping it here.
general {
    hide_cursor = false
}

# INPUT FIELD

# input-field {
#     monitor =
#     size = 200, 50
#     outline_thickness = 2
#     hide_input = false
#
#     # show real dots inside field
#     dots_center = true
#     dots_rounding = -1
#     dots_spacing = 0.3
#     dots_size = 0.3
#     dots_text_format = "•"
#
#     # disable border indicators
#     fade_on_empty = false
#     placeholder_text = "Password..."
# }
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.8 # Scale of input-field height, 0.2 - 0.8
    dots_color = rgba(255, 255, 255, 1.0)
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = 100
hide_input = false
dots_text_format = <i><span foreground="##cdd6f4">•</span></i>
font_color = #ffffff 
    outer_color = rgba(0, 0, 0, 1)
inner_color = rgba(0, 0, 0, 1)
# font_color = $foreground
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:60000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  # 30s, not 1s: this renders at minute resolution, so a 1s poll forked a
  # shell + date 60x more often than the text could change. Worst-case the
  # clock reads 29s stale, which is invisible at %-I:%M.
  text = cmd[update:30000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}



# Profile Picture
image {
    monitor =
    size = 100
    border_size = 2
    border_color = $foreground
    position = 0, -100
    halign = center
    valign = center
}

# Desktop Environment
image {
    monitor =
    size = 75
    border_size = 2
    border_color = $foreground
    position = -50, 50
    halign = right
    valign = bottom
}

# CURRENT SONG
label {
    monitor =
    # 5s: measured 13ms/call (bash + a playerctl D-Bus roundtrip), the most
    # expensive of the three cmd labels.
    text = cmd[update:5000] echo "$($HOME/scripts/whatsong.sh)"
    color = $foreground
    # color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    # Echoed rather than hardcoded so this config isn't tied to one machine.
    text = cmd[update:3600000] echo "$USER"
    color = $foreground
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = top
}

label {
    monitor =
    # 10s: SSID and signal barely move while the screen is locked.
    text = cmd[update:10000] echo "$($HOME/scripts/network-status.sh)"
    color = $foreground
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -20, -10
    halign = right
    valign = top
}
