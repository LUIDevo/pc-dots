##### PREFIX #####
set -g prefix C-a
unbind C-b
bind-key S command-prompt -p "New session name:" "new-session -s '%%'"
bind-key W command-prompt -p "New window name:" "new-window -c '#{pane_current_path}' -n '%%'"
bind-key Space last-window
bind u attach-session -t . -c '#{pane_current_path}'
set -g extended-keys-format csi-u
set -g extended-keys on

# tmux gates modified-key forwarding (Shift+Enter etc.) behind the `extkeys`
# feature. The built-in xterm* feature set omits it, so with TERM=xterm-256color
# tmux never asks the outer terminal to report modified keys.
set -as terminal-features 'xterm*:extkeys'

##### TERMINAL & COLOR #####
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
bind r command-prompt -I "#W" "rename-window '%%'"

##### UI / BEHAVIOR #####
set -g mouse on
set -g visual-activity off
set -g set-clipboard on
set -gq allow-passthrough on
set-option -g allow-rename off

##### FIXED GLOBAL STATUS BAR LAYOUT #####
set -g status-position top   
set -g status-bg "#0f0f0f"

# Force strict center alignment and give left/right sides identical equal bounds
set -g status-justify absolute-centre
set -g status-left-length 150
set -g status-right-length 150

##### PANE KEYBINDINGS #####
bind s split-window -v
bind v split-window -h
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left  resize-pane -L 20
bind -n M-Right resize-pane -R 20
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

bind H swap-pane -U
bind L swap-pane -D
bind K swap-pane -U
bind J swap-pane -D

##### POPUPS & MENUS #####
set -g popup-style "bg=default"
set -g popup-border-style "fg=#89b4fa"

bind-key C-j display-popup -w 80% -h 80% -E "~/.tmux/sessionizer.sh"
bind f display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind-key Enter display-popup -d "~" -w 90% -h 90% -E "bash --rcfile <(cat ~/.bashrc; echo 'cat ~/.cache/wal/sequences')"
bind-key C-t display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "bash"
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key M command-prompt -p "Move pane to window:" "join-pane -t '%%'"

bind c display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  "tmux" t "display-popup -E 'nvim ~/.tmux.conf'" \
  "kitty" k "display-popup -E 'nvim ~/.config/kitty/kitty.conf'" \
  "nvim" n "display-popup -E 'nvim ~/.config/nvim/'" \
  "hypr" h "display-popup -d ~/.config/hypr/ -E 'nvim ~/.config/hypr/'" \
  "exit" q ""

bind-key d detach
bind-key w choose-tree -Zw

##### PLUGINS (DECLARE ONLY) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/catppuccin-tmux'

##### RESURRECT SETTINGS #####
set -g @resurrect-save ''
set -g @resurrect-restore ''
bind C-s run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"
bind C-r run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/restore.sh"

##### CATPPUCCIN THEME GLOBAL CONFIG #####
# 1. Base flavor must be declared first
set -g @catppuccin_flavor "mocha"

# 2. Layout, shapes, formats, and modules configuration
set -g @catppuccin_window_status_style "round"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_middle_separator " | "

set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_default_text " #W "

set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text " #W "

set -g window-status-separator " "

set -g @catppuccin_status_modules_left "session directory"
set -g @catppuccin_status_modules_right "application date_time"

set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_session_text " #S "
set -g @catppuccin_directory_text " #{b:pane_current_path} "
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M "

# 3. Apply Module Colors
set -g @catppuccin_application_color "#cba6f7"
set -g @catppuccin_directory_color "#89b4fa"
set -g @catppuccin_date_time_color "#89dceb"

# 4. WINDOW COLOR OVERRIDES (Put your custom hex codes here)
# Change the background and text color of your regular/inactive tabs
set -g @catppuccin_window_current_color "blue" 
set -g @catppuccin_window_current_background "#{@catppuccin_crust}"

set -g @catppuccin_window_default_color "surface_1"
set -g @catppuccin_window_default_background "#{@catppuccin_crust}"

##### TPM INITIALIZATION (MUST BE THE ABSOLUTE LAST LINE) #####
run-shell "$HOME/.tmux/plugins/tpm/tpm"
 set -g status-justify absolute-centre

set -g status-bg "#0f0f0f" 

set -g @catppuccin_status_left_separator "█"

set -g @catppuccin_status_right_separator "█" 
set -g window-status-current-style "bg=#fab387,fg=#11111b"

# 2. Color of the INACTIVE window tabs in the center
set -g window-status-style "bg=#313244,fg=#cdd6f4"

# 3. Maintain your strict center alignment layout
set -g status-justify absolute-centre
set -g status-bg "#0f0f0f"
# Inactive windows
set -g @catppuccin_window_default_background "#1e1e2e"
set -g @catppuccin_window_default_color "#cdd6f4"

# Active window
set -g @catppuccin_window_current_background "#89b4fa"
set -g @catppuccin_window_current_color "#11111b"
